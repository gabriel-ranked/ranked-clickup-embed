name: Atualiza embed de entrega de posts

on:
  schedule:
    # 11:00 UTC = 08:00 em São Paulo (UTC-03:00, sem horário de verão)
    - cron: "0 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Buscar dados do ClickUp e atualizar index.html
        env:
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
        run: node scripts/update.mjs

      - name: Commit e push (só se algo mudou)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -m "Atualiza dados do ClickUp"
            git push
          fi
